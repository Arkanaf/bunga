<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070a">
<title>ASCII Lilies</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas#screen { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  body.has-question canvas#screen { height: calc(100vh - 150px); }
  body.has-reaction canvas#screen { height: calc(100vh - 200px); }
  #celebration { position: fixed; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }
  .question {
    position: fixed;
    inset: auto 0 0;
    z-index: 2;
    display: grid;
    min-height: 150px;
    box-sizing: border-box;
    align-content: center;
    justify-items: center;
    gap: .8rem;
    padding: 1rem;
    background: linear-gradient(180deg, rgb(5 12 8 / 92%), #050807);
    border-top: 1px solid rgb(143 198 156 / 40%);
    color: #eaffed;
    font-family: "Courier New", monospace;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity 500ms ease, transform 500ms ease, visibility 500ms;
  }
  body.has-question .question { opacity: 1; visibility: visible; transform: translateY(0); }
  body.has-reaction .question { min-height: 200px; }
  .question__title { margin: 0; font-size: clamp(.95rem, 3.8vw, 1.3rem); letter-spacing: .06em; text-shadow: 0 0 14px rgb(125 255 164 / 35%); }
  .question__buttons { display: flex; justify-content: center; gap: .8rem; }
  .question__button {
    min-width: 90px;
    padding: .65rem 1.2rem;
    border: 1px solid #8fc69c;
    background: #10251a;
    color: #eaffed;
    font: inherit;
    letter-spacing: .12em;
    cursor: pointer;
  }
  .question__button:hover, .question__button:focus-visible { outline: 2px solid #d5f7dc; outline-offset: 2px; background: #1b3c28; }
  .question__button--no { border-color: #9caaa0; background: #141816; color: #d3ded5; }
  .question__answer { max-width: calc(100vw - 2rem); min-height: 1.2em; margin: 0; color: #a9e7b6; font-size: .85rem; line-height: 1.45; overflow-wrap: anywhere; }
  .question__face { display: none; margin: -.25rem 0; font-family: sans-serif; font-size: 2.5rem; line-height: 1; }
  .question__face.is-visible { display: block; animation: face-pop 350ms ease-out both; }
  @keyframes face-pop { from { opacity: 0; transform: scale(.5) rotate(-12deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
  @media (max-width: 600px) {
    body.has-question canvas#screen { height: calc(100vh - 170px); }
    body.has-reaction canvas#screen { height: calc(100vh - 220px); }
    .question { min-height: 170px; padding: 1rem .75rem; }
    body.has-reaction .question { min-height: 220px; }
    .question__buttons { gap: .6rem; }
  }
  .intro {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #101a16 0%, #080b0b 42%, #030405 100%);
    color: #e8f4e9;
    font-family: "Courier New", monospace;
    text-align: center;
    transition: opacity 900ms ease, visibility 900ms ease;
  }
  .intro::before, .intro::after {
    position: absolute;
    inset: -50%;
    content: "";
    pointer-events: none;
    background-image: repeating-linear-gradient(0deg, transparent 0 25px, rgb(114 211 148 / 10%) 26px, transparent 27px 48px);
    transform: rotate(-17deg);
    animation: code-drift 16s linear infinite;
  }
  .intro::after {
    opacity: .35;
    transform: rotate(17deg) translateY(-30px);
    animation-duration: 23s;
    animation-direction: reverse;
  }
  .intro__content { position: relative; z-index: 1; width: min(90vw, 560px); padding: 2rem 1rem; }
  .intro__eyebrow { color: #94cda4; font-size: .75rem; letter-spacing: .35em; }
  .intro__title {
    min-height: 2.5em;
    margin: 1.5rem 0 2rem;
    color: #f0fff2;
    font-size: clamp(1.3rem, 5vw, 2.5rem);
    font-weight: 400;
    letter-spacing: .12em;
    text-shadow: 0 0 18px rgb(125 255 164 / 45%);
  }
  .intro__button {
    padding: 1rem 1.6rem;
    border: 1px solid #8fc69c;
    background: rgb(14 31 21 / 75%);
    color: #eaffed;
    font: inherit;
    font-size: .85rem;
    letter-spacing: .2em;
    cursor: pointer;
    box-shadow: 0 0 24px rgb(100 255 141 / 12%), inset 0 0 18px rgb(100 255 141 / 7%);
    transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
  }
  .intro__button:hover, .intro__button:focus-visible {
    outline: none;
    background: #193b27;
    box-shadow: 0 0 32px rgb(100 255 141 / 28%), inset 0 0 18px rgb(100 255 141 / 12%);
    transform: translateY(-2px);
  }
  .intro__hint { margin-top: 1.2rem; color: #91a99a; font-size: .7rem; letter-spacing: .1em; }
  .intro.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
  @keyframes code-drift { to { background-position-y: 480px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    .intro { transition-duration: .01ms; }
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<canvas id="celebration" aria-hidden="true"></canvas>
<section class="question" id="question" aria-labelledby="question-title" aria-live="polite">
  <h2 class="question__title" id="question-title">Will you be my girlfriend again?</h2>
  <div class="question__buttons" id="question-buttons">
    <button class="question__button" id="yes-button" type="button">YES</button>
    <button class="question__button question__button--no" id="no-button" type="button">NO</button>
  </div>
  <div class="question__face" id="no-face" aria-live="polite" aria-label="Angry face">😠</div>
  <p class="question__answer" id="answer" aria-live="polite"></p>
</section>
<main class="intro" id="intro">
  <div class="intro__content">
    <div class="intro__eyebrow">A GIFT IS GROWING</div>
    <h1 class="intro__title" id="intro-title">01001000 01000101 01001100 01001100 01001111</h1>
    <button class="intro__button" id="start-button" type="button">PRESS THE BUTTON</button>
    <div class="intro__hint">[ CLICK OR PRESS ENTER ]</div>
  </div>
</main>
<script src="bouquet.js"></script>
<script>
  (() => {
    const yesButton = document.getElementById('yes-button');
    const noButton = document.getElementById('no-button');
    const questionTitle = document.getElementById('question-title');
    const answer = document.getElementById('answer');
    const noFace = document.getElementById('no-face');
    const celebration = document.getElementById('celebration');
    const context = celebration.getContext('2d');
    let particles = [];
    let fireworkFrame = 0;
    let burstCount = 0;
    let fireworkInterval = 0;
    let faceTimer = 0;
    let audioContext = null;
    const FIREWORK_BURSTS = 11;

    function playTone(frequency, duration, type = 'sine', endFrequency = frequency, delay = 0) {
      const AudioContextClass = window.AudioContext;
      if (!AudioContextClass) return;
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === 'suspended') void audioContext.resume();

      const startAt = audioContext.currentTime + delay;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, startAt);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), startAt + duration);
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(0.16, startAt + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(startAt);
      oscillator.stop(startAt + duration);
    }

    function playCelebrationTune() {
      [523, 659, 784, 1047, 784, 1047].forEach((frequency, index) => {
        playTone(frequency, .32, 'sine', frequency * 1.08, index * .16);
      });
      playTone(440, .55, 'triangle', 880, .95);
      playTone(587, .55, 'triangle', 1174, 1.15);
    }

    function resizeCelebration() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      celebration.width = Math.floor(window.innerWidth * ratio);
      celebration.height = Math.floor(window.innerHeight * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function burst() {
      const x = window.innerWidth * (0.12 + Math.random() * 0.76);
      const y = window.innerHeight * (0.1 + Math.random() * 0.5);
      const colors = ['#9cffb1', '#ff9fc4', '#fff1a8', '#b6f7ff', '#d7a8ff', '#ffb36b'];
      const color = colors[burstCount % colors.length];
      const count = 90 + Math.floor(Math.random() * 45);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 5.2;
        particles.push({
          x, y, previousX: x, previousY: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 65 + Math.random() * 40,
          char: Math.random() < 0.82 ? (Math.random() < 0.5 ? '0' : '1') : '+',
          size: 12 + Math.random() * 7,
          color,
        });
      }
      burstCount += 1;
    }

    function animateFireworks() {
      context.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles = particles.filter((particle) => particle.life > 0);
      for (const particle of particles) {
        const alpha = Math.min(1, particle.life / 30);
        context.globalAlpha = alpha * 0.5;
        context.strokeStyle = particle.color;
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(particle.previousX, particle.previousY);
        context.lineTo(particle.x, particle.y);
        context.stroke();
        context.globalAlpha = alpha;
        context.font = `bold ${particle.size}px "Courier New", monospace`;
        context.fillStyle = particle.color;
        context.shadowColor = particle.color;
        context.shadowBlur = 10;
        context.fillText(particle.char, particle.x, particle.y);
        context.shadowBlur = 0;
        particle.previousX = particle.x;
        particle.previousY = particle.y;
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vx *= 0.988;
        particle.vy = particle.vy * 0.988 + 0.035;
        particle.life -= 1.15;
      }
      context.globalAlpha = 1;
      if (particles.length || burstCount < FIREWORK_BURSTS) fireworkFrame = requestAnimationFrame(animateFireworks);
      else context.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    yesButton.addEventListener('click', () => {
      if (yesButton.disabled) return;
      yesButton.disabled = true;
      noButton.disabled = true;
      document.body.classList.add('has-reaction');
      if (fireworkFrame) cancelAnimationFrame(fireworkFrame);
      window.clearInterval(fireworkInterval);
      particles = [];
      burstCount = 0;
      questionTitle.textContent = 'MIMAACI SAYANG I LOVE U';
      answer.textContent = Array.from('KITA MULAI LAGI!').map((character) =>
        character.charCodeAt(0).toString(2).padStart(8, '0')
      ).join(' ');
      burst();
      animateFireworks();
      playCelebrationTune();
      fireworkInterval = window.setInterval(() => {
        if (burstCount >= FIREWORK_BURSTS) {
          window.clearInterval(fireworkInterval);
          return;
        }
        burst();
        if (burstCount % 3 === 0) playTone(180 + Math.random() * 100, .12, 'triangle', 70);
      }, 360);
    });

    noButton.addEventListener('click', () => {
      if (noButton.disabled) return;
      document.body.classList.add('has-reaction');
      window.clearTimeout(faceTimer);
      noFace.textContent = '😠';
      noFace.setAttribute('aria-label', 'Angry face');
      noFace.classList.remove('is-visible');
      void noFace.offsetWidth;
      noFace.classList.add('is-visible');
      answer.textContent = 'That is okay. Thank you for being honest.';
      playTone(320, .32, 'triangle', 170);
      faceTimer = window.setTimeout(() => {
        noFace.textContent = '😭';
        noFace.setAttribute('aria-label', 'Crying face');
        noFace.classList.remove('is-visible');
        void noFace.offsetWidth;
        noFace.classList.add('is-visible');
        playTone(520, .8, 'sine', 240);
      }, 1000);
    });

    window.addEventListener('resize', resizeCelebration);
    resizeCelebration();

    const intro = document.getElementById('intro');
    const title = document.getElementById('intro-title');
    const button = document.getElementById('start-button');
    const message = 'SOMETHING IS BLOOMING';
    const chars = '01<>[]{}#$%';
    let frame = 0;
    let started = false;

    function revealTitle() {
      const progress = frame / 26;
      title.textContent = message.split('').map((char, index) => {
        if (char === ' ') return ' ';
        if (index < progress) return char;
        return chars[Math.floor(Math.random() * chars.length)];
      }).join('');
      frame += 1;
      if (frame <= 26) window.setTimeout(revealTitle, 55);
      else title.textContent = message;
    }

    function start() {
      if (started) return;
      started = true;
      intro.classList.add('is-leaving');
      window.dispatchEvent(new Event('start-bloom'));
    }

    button.addEventListener('click', start);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !started) start();
    });
    revealTitle();
  })();
</script>
</body>
</html>
